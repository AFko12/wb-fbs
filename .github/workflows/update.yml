name: Обновление данных дашборда

on:
  schedule:
    - cron: "30 0 * * *"   # 03:30 по Москве — тихое время, сторонние сервисы обычно спят
    - cron: "0 11 * * *"   # 14:00 по Москве — дневная досинхронизация
  workflow_dispatch:
    inputs:
      refresh_orders:
        description: "Перечитать все заказы заново (подтянуть предметы и артикулы). Продажи и даты вручения сохраняются."
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 200   # скрипт терпеливо ждёт лимит WB до 3 часов
    steps:
      - uses: actions/checkout@v4

      - name: Забрать изменения из WB (инкрементально) и пересобрать страницу
        env:
          WB_TOKEN: ${{ secrets.WB_TOKEN }}
          EXTRA: ${{ inputs.refresh_orders && '--refresh-orders' || '' }}
        run: python3 fetch_wb_data.py --inject index.html $EXTRA

      - name: Закоммитить обновление
        if: always()
        run: |
          git config user.name "wb-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "нет изменений" && exit 0
          git commit -m "Автообновление данных $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
